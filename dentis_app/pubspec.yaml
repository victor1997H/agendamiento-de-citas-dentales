name: dentis_app
description: Sistema odontológico con almacenamiento local SQLite y sincronización PostgreSQL

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0-93.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Peticiones HTTP
  http: ^1.2.1

  # API REST
  dio: ^5.8.0+1

  # Base de datos local SQLite
  sqflite: ^2.4.2

  # Manejo de rutas SQLite
  path: ^1.9.1

  # Detectar conexión a internet
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/fondo.jpg